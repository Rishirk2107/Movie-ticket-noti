<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BookMyShow Theatre Watcher</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }
    .card {
      background: #fff;
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    h2 { margin-top: 0; color: #111; }
    label { display: block; font-weight: 600; margin-top: 14px; margin-bottom: 6px; font-size: 14px; }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .row { display: flex; gap: 14px; }
    .row > div { flex: 1; }
    button {
      background: #e50914;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background: #b80710; }
    pre {
      background: #f6f8fa;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 16px;
      margin-top: 24px;
      font-size: 12px;
      overflow-x: auto;
    }
    .hint { font-size: 12px; color: #666; font-weight: normal; margin-left: 4px; }

    /* Tag / Chip Input for Emails */
    .tags-input-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      min-height: 42px;
      cursor: text;
      background: #fff;
    }
    .tags-input-container:focus-within {
      border-color: #0066cc;
      box-shadow: 0 0 0 1px #0066cc;
    }
    .email-chip {
      display: inline-flex;
      align-items: center;
      background-color: #e8f0fe;
      color: #1967d2;
      font-size: 13px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 16px;
      border: 1px solid #c2d7fa;
    }
    .email-chip span.remove-btn {
      margin-left: 6px;
      cursor: pointer;
      font-size: 16px;
      line-height: 12px;
      font-weight: bold;
      color: #70757a;
    }
    .email-chip span.remove-btn:hover {
      color: #d93025;
    }
    .tags-input-container input {
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      padding: 6px 4px !important;
      flex: 1;
      min-width: 160px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎬 BookMyShow Theatre Watcher</h2>
    <form id="watchForm">
      <label>BookMyShow Showtimes URL</label>
      <input id="url" type="url" placeholder="https://in.bookmyshow.com/movies/.../buytickets/..." required />

      <div class="row">
        <div>
          <label>Start Date <span class="hint">(Detected from link)</span></label>
          <input id="startDate" type="date" required />
        </div>
        <div>
          <label>End Date <span class="hint">(Max 2 weeks from start)</span></label>
          <input id="endDate" type="date" required />
        </div>
      </div>

      <div class="row">
        <div>
          <label>Interval (minutes)</label>
          <input id="interval" type="number" min="1" max="60" value="2" required />
        </div>
        <div>
          <label>Label <span class="hint">(Optional)</span></label>
          <input id="label" type="text" placeholder="e.g. Avengers Doomsday" />
        </div>
      </div>

      <label>Alert Emails <span class="hint">(Type email and press Enter, Comma, or Space)</span></label>
      <div class="tags-input-container" id="emailChipsContainer">
        <input id="emailInput" type="text" placeholder="Type email and hit Enter..." />
      </div>

      <button type="submit">Start Watching</button>
    </form>
  </div>

  <h3>Active Watches</h3>
  <pre id="out">Loading...</pre>

  <script>
    const urlInput = document.getElementById('url');
    const startDateInput = document.getElementById('startDate');
    const endDateInput = document.getElementById('endDate');
    const emailInput = document.getElementById('emailInput');
    const emailChipsContainer = document.getElementById('emailChipsContainer');

    const emailsList = [];

    function renderChips() {
      emailChipsContainer.querySelectorAll('.email-chip').forEach(c => c.remove());
      
      emailsList.forEach((email, idx) => {
        const chip = document.createElement('span');
        chip.className = 'email-chip';
        chip.textContent = email;

        const removeBtn = document.createElement('span');
        removeBtn.className = 'remove-btn';
        removeBtn.innerHTML = '&times;';
        removeBtn.onclick = (e) => {
          e.stopPropagation();
          emailsList.splice(idx, 1);
          renderChips();
        };

        chip.appendChild(removeBtn);
        emailChipsContainer.insertBefore(chip, emailInput);
      });
    }

    function addEmail(val) {
      const trimmed = val.trim().replace(/,$/, '');
      if (!trimmed) return;
      if (!emailsList.includes(trimmed)) {
        emailsList.push(trimmed);
        renderChips();
      }
      emailInput.value = '';
    }

    emailChipsContainer.addEventListener('click', () => {
      emailInput.focus();
    });

    emailInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ',' || e.key === ' ') {
        e.preventDefault();
        addEmail(emailInput.value);
      } else if (e.key === 'Backspace' && !emailInput.value && emailsList.length > 0) {
        emailsList.pop();
        renderChips();
      }
    });

    emailInput.addEventListener('paste', (e) => {
      e.preventDefault();
      const pasted = (e.clipboardData || window.clipboardData).getData('text');
      const parts = pasted.split(/[\s,]+/);
      parts.forEach(p => addEmail(p));
    });

    function parseDateFromUrl(urlStr) {
      try {
        const url = new URL(urlStr);
        const parts = url.pathname.split('/').filter(Boolean);
        const idx = parts.indexOf('buytickets');
        let dateStr = url.searchParams.get('dateCode');
        if (!dateStr && idx !== -1 && idx + 2 < parts.length) {
          dateStr = parts[idx + 2];
        }
        if (dateStr && /^[0-9]{8}$/.test(dateStr)) {
          return `${dateStr.substring(0,4)}-${dateStr.substring(4,6)}-${dateStr.substring(6,8)}`;
        }
      } catch (e) {}
      return null;
    }

    urlInput.addEventListener('input', () => {
      const detected = parseDateFromUrl(urlInput.value);
      if (detected) {
        startDateInput.value = detected;
        updateDateRangeBounds(detected);
      }
    });

    startDateInput.addEventListener('change', () => {
      updateDateRangeBounds(startDateInput.value);
    });

    function updateDateRangeBounds(startVal) {
      if (!startVal) return;
      const s = new Date(startVal);
      const maxDate = new Date(s);
      maxDate.setDate(s.getDate() + 14);

      const maxIso = maxDate.toISOString().split('T')[0];
      endDateInput.min = startVal;
      endDateInput.max = maxIso;

      if (!endDateInput.value || endDateInput.value < startVal || endDateInput.value > maxIso) {
        endDateInput.value = startVal;
      }
    }

    async function refresh() {
      const res = await fetch('/watches');
      document.getElementById('out').textContent = JSON.stringify(await res.json(), null, 2);
    }

    document.getElementById('watchForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (emailInput.value) {
        addEmail(emailInput.value);
      }
      const body = {
        url: urlInput.value,
        start_date: startDateInput.value,
        end_date: endDateInput.value,
        interval_minutes: Number(document.getElementById('interval').value),
        label: document.getElementById('label').value || null,
        emails: [...emailsList]
      };
      const res = await fetch('/watches', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const err = await res.json();
        alert('Error: ' + (err.detail || 'Could not save watch'));
        return;
      }
      refresh();
    });

    refresh();
  </script>
</body>
</html>
