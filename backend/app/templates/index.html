<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMS Watcher — Active Watches</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 16px 48px;
      color: #1f2937;
      background: #f3f4f6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top Nav ── */
    .topnav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .topnav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topnav-brand .logo {
      width: 32px; height: 32px;
      background: #dc2626;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 15px; letter-spacing: -1px;
    }
    .topnav-brand h1 {
      margin: 0; font-size: 17px; font-weight: 700; color: #111827;
    }
    .topnav-brand h1 span { color: #dc2626; }
    .nav-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      background: #dc2626;
      color: #fff;
      border: none; border-radius: 7px;
      font-size: 13px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: #b91c1c; }

    /* ── Cards ── */
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px 22px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
      margin-bottom: 20px;
    }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
    }
    .card-header h2 {
      margin: 0; font-size: 16px; font-weight: 700; color: #111827;
    }

    /* ── Search ── */
    .search-wrap input {
      width: 100%; padding: 9px 12px;
      border: 1px solid #d1d5db; border-radius: 7px;
      font-size: 13px; outline: none; background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-wrap input:focus {
      border-color: #dc2626; box-shadow: 0 0 0 2px #fee2e2;
    }

    /* ── Watches list ── */
    .watches-scroll {
      max-height: 500px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px;
      padding-right: 2px; margin-top: 12px;
    }
    .watches-scroll::-webkit-scrollbar { width: 5px; }
    .watches-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

    .watch-card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
      padding: 14px 16px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    }
    .watch-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
    .watch-title {
      font-size: 14px; font-weight: 700; color: #111827;
      display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    }
    .badge {
      font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
    }
    .badge-active { background: #dcfce7; color: #166534; }
    .watch-meta {
      font-size: 11px; color: #6b7280;
      display: flex; flex-wrap: wrap; gap: 10px;
    }
    .watch-meta span { display: inline-flex; align-items: center; gap: 3px; }
    .meta-pill {
      display: inline-block;
      background: #f3f4f6; border-radius: 5px;
      padding: 2px 7px; font-size: 10px; color: #374151;
      margin: 1px 2px;
    }
    .watch-dates-strip {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;
    }
    .watch-right { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .delete-btn {
      background: transparent; border: 1px solid #fecaca;
      color: #dc2626; padding: 5px 12px; border-radius: 6px;
      font-size: 11px; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    .delete-btn:hover { background: #fef2f2; }
    .venue-link {
      font-size: 11px; color: #6b7280; text-decoration: none; cursor: pointer;
    }
    .venue-link:hover { color: #dc2626; text-decoration: underline; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 36px 20px;
      color: #9ca3af; font-size: 13px;
      border: 1px dashed #e5e7eb; border-radius: 10px;
      background: #fff;
    }
    .empty-state strong { display: block; font-size: 15px; color: #6b7280; margin-bottom: 6px; }

    /* ── Logs ── */
    .log-box {
      background: #111827; border-radius: 10px;
      padding: 14px 16px; font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 11.5px; color: #d1d5db;
      max-height: 320px; overflow-y: auto;
      display: flex; flex-direction: column-reverse;
    }
    .log-box::-webkit-scrollbar { width: 5px; }
    .log-box::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    .log-line { padding: 2px 0; border-bottom: 1px solid #1f2937; }
    .log-ts { color: #6b7280; }
    .log-INFO { color: #60a5fa; }
    .log-SUCCESS { color: #34d399; }
    .log-WARN { color: #fbbf24; }
    .log-ERROR { color: #f87171; }

    .log-status {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399;
           animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

    /* ── Modal for venues ── */
    .modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff; border-radius: 12px;
      padding: 22px 24px; width: 100%; max-width: 540px;
      max-height: 80vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .modal-header h3 { margin: 0; font-size: 15px; font-weight: 700; }
    .modal-close {
      background: none; border: none; font-size: 20px; cursor: pointer;
      color: #9ca3af; line-height: 1; padding: 0;
    }
    .modal-close:hover { color: #374151; }
    .venue-row {
      padding: 7px 0; border-bottom: 1px solid #f3f4f6;
      display: flex; align-items: center; gap: 10px;
      font-size: 12px; color: #374151;
    }
    .venue-row:last-child { border-bottom: none; }
    .venue-code-badge {
      font-size: 10px; background: #f3f4f6; border-radius: 4px;
      padding: 2px 6px; color: #6b7280; white-space: nowrap;
    }
    .venue-date-badge {
      font-size: 10px; background: #eff6ff; border-radius: 4px;
      padding: 2px 6px; color: #2563eb; white-space: nowrap;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .watch-card { flex-direction: column; }
      .watch-right { flex-direction: row; align-items: center; width: 100%; justify-content: space-between; }
      .topnav { flex-direction: row; }
    }
  </style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-brand">
    <div class="logo">BM</div>
    <h1>BMS <span>Watcher</span></h1>
  </div>
  <a href="/create" class="nav-btn">+ Create Watch</a>
</nav>

<!-- Active Watches -->
<div class="card">
  <div class="card-header">
    <h2>Active Watches</h2>
    <span id="watchCount" style="font-size:12px;color:#6b7280;"></span>
  </div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search by label…" oninput="filterWatches()" />
  </div>
  <div class="watches-scroll" id="watchesList">
    <div class="empty-state"><strong>Loading…</strong></div>
  </div>
</div>

<!-- Live Logs -->
<div class="card">
  <div class="card-header">
    <h2>Live API Logs</h2>
    <div class="log-status">
      <div class="dot"></div>
      <span style="font-size:12px;color:#6b7280;">Live</span>
    </div>
  </div>
  <div class="log-box" id="logBox">
    <div style="color:#6b7280;font-size:11px;">Waiting for logs…</div>
  </div>
</div>

<!-- Venue Modal -->
<div class="modal-backdrop" id="venueModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Known Venues</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  let allWatches = [];

  // ── Date formatting helpers (local, no UTC shift) ──
  function fmtDate8(d) {
    if (!d || d.length < 8) return d;
    return `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
  }
  function fmtDateISO(s) {
    if (!s) return '';
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  }

  // ── Fetch watches ──
  async function loadWatches() {
    try {
      const r = await fetch('/watches');
      allWatches = await r.json();
      renderWatches();
    } catch (e) {
      document.getElementById('watchesList').innerHTML =
        '<div class="empty-state"><strong>Failed to load watches.</strong>' + e + '</div>';
    }
  }

  function filterWatches() { renderWatches(); }

  function renderWatches() {
    const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
    const list = q
      ? allWatches.filter(w => (w.label || '').toLowerCase().includes(q)
          || (w.movie_name || '').toLowerCase().includes(q))
      : allWatches;

    document.getElementById('watchCount').textContent = `${list.length} watch${list.length !== 1 ? 'es' : ''}`;

    if (!list.length) {
      document.getElementById('watchesList').innerHTML =
        q ? '<div class="empty-state"><strong>No watches match your search.</strong></div>'
          : '<div class="empty-state"><strong>No active watches.</strong>Click <b>+ Create Watch</b> above to get started.</div>';
      return;
    }

    document.getElementById('watchesList').innerHTML = list.map(w => {
      const dateRange = (w.start_date && w.end_date && w.start_date !== w.end_date)
        ? `${fmtDateISO(w.start_date)} – ${fmtDateISO(w.end_date)}`
        : fmtDateISO(w.start_date || '');
      const avail = (w.available_dates || []).slice(0, 10);
      const datePills = avail.map(d => `<span class="meta-pill">${fmtDate8(d)}</span>`).join('');
      const moreDates = (w.available_dates || []).length > 10
        ? `<span class="meta-pill">+${(w.available_dates||[]).length - 10} more</span>` : '';
      const movieLine = w.movie_name ? `<span style="color:#374151;font-weight:600;">${escHtml(w.movie_name)}</span> · ` : '';
      return `
        <div class="watch-card" data-id="${w._id}">
          <div class="watch-left">
            <div class="watch-title">
              <span>${escHtml(w.label)}</span>
              <span class="badge badge-active">Active</span>
            </div>
            <div style="font-size:11px;color:#6b7280;">${movieLine}${escHtml(w.city||'')}${w.language ? ' · ' + w.language : ''}</div>
            <div class="watch-meta">
              <span>Dates: ${dateRange || '—'}</span>
              <span>Interval: ${w.interval_minutes} min</span>
              <span>Known venues: <b>${w.known_venue_count || 0}</b></span>
            </div>
            ${avail.length ? `<div class="watch-dates-strip">${datePills}${moreDates}</div>` : ''}
            ${w.last_error ? `<div style="font-size:11px;color:#ef4444;margin-top:3px;">Error: ${escHtml(w.last_error)}</div>` : ''}
          </div>
          <div class="watch-right">
            <button class="delete-btn" onclick="deleteWatch('${w._id}')">Delete</button>
            <a class="venue-link" onclick="openVenues('${w._id}', '${escHtml(w.label)}')">View venues ›</a>
          </div>
        </div>`;
    }).join('');
  }

  // ── Delete ──
  async function deleteWatch(id) {
    if (!confirm('Delete this watch and all its data?')) return;
    await fetch(`/watches/${id}`, { method: 'DELETE' });
    await loadWatches();
  }

  // ── Venue modal ──
  async function openVenues(id, label) {
    document.getElementById('modalTitle').textContent = `Venues — ${label}`;
    document.getElementById('modalBody').innerHTML = '<div style="color:#6b7280;font-size:12px;">Loading…</div>';
    document.getElementById('venueModal').classList.add('open');
    try {
      const r = await fetch(`/watches/${id}/venues`);
      const venues = await r.json();
      if (!venues.length) {
        document.getElementById('modalBody').innerHTML = '<div style="color:#9ca3af;font-size:12px;">No venues recorded yet.</div>';
        return;
      }
      document.getElementById('modalBody').innerHTML = venues.map(v =>
        `<div class="venue-row">
          <span style="flex:1;">${escHtml(v.venue_name || v.venue_code)}</span>
          <span class="venue-code-badge">${escHtml(v.venue_code)}</span>
          <span class="venue-date-badge">${fmtDate8(v.date_code)}</span>
        </div>`
      ).join('');
    } catch (e) {
      document.getElementById('modalBody').innerHTML = `<div style="color:#ef4444;font-size:12px;">Error: ${e}</div>`;
    }
  }
  function closeModal() {
    document.getElementById('venueModal').classList.remove('open');
  }
  document.getElementById('venueModal').addEventListener('click', e => {
    if (e.target === document.getElementById('venueModal')) closeModal();
  });

  // ── Logs ──
  const LOG_COLORS = { INFO:'#60a5fa', SUCCESS:'#34d399', WARN:'#fbbf24', ERROR:'#f87171' };
  async function loadLogs() {
    try {
      const r = await fetch('/logs?limit=80');
      const { logs } = await r.json();
      const box = document.getElementById('logBox');
      if (!logs || !logs.length) return;
      box.innerHTML = [...logs].reverse().map(l => {
        const col = LOG_COLORS[l.level] || '#d1d5db';
        return `<div class="log-line">
          <span class="log-ts">[${l.time}]</span>
          <span style="color:${col};font-weight:600;"> ${l.level}</span>
          <span> ${escHtml(l.message)}</span>
        </div>`;
      }).join('');
    } catch (_) {}
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadWatches();
  loadLogs();
  setInterval(loadWatches, 15000);
  setInterval(loadLogs, 5000);
</script>
</body>
</html>
